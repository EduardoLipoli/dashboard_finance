<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro Controle de finanças</title>
  <link rel="stylesheet" href="/style-login.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="icon" type="image/x-icon" href="/images/money.ico" />
</head>

<body
  class="bg-[url('/images/background.jpg')] bg-cover bg-center bg-no-repeat min-h-screen grid place-items-center px-20">
  <div id="alert-container" class="fixed top-20 right-4 z-50"></div>

  <main class="min-h-screen flex items-center justify-center">
    <div
      class="w-[420px] bg-zinc-800 text-zinc-200 rounded-lg shadow-lg p-8 space-y-6 backdrop-filter backdrop-blur-md bg-opacity-10 border border-zinc-800">
      <!-- Cabeçalho -->
      <h1 class="text-2xl font-bold text-center">Cadastre-se</h1>
      <p class="text-sm text-center text-zinc-400">
        Já possui uma conta?
        <a href="#" class="text-green-500 hover:underline" onclick="login()">Login</a>
      </p>

      <!-- Formulário -->
      <form class="space-y-4">

        <!-- Campo de E-mail -->
        <div>
          <label for="nome" class="block text-sm font-medium">Nome</label>
          <input type="text" id="nome" name="nome"
            class="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            placeholder="Digite seu Nome" onchange="onChangeNome()" />
          <div class="error text-sm text-red-500 hidden" id="nome-required-error">
            Nome é obrigatório
          </div>
        </div>

        <!-- Campo de E-mail -->
        <div>
          <label for="email" class="block text-sm font-medium">E-mail</label>
          <input type="email" id="email" name="email"
            class="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            placeholder="Digite seu e-mail" onchange="onChangeEmail()" />
          <div class="error text-sm text-red-500 hidden" id="email-required-error">
            Email é obrigatório
          </div>
          <div class="error text-sm text-red-500 hidden" id="email-invalid-error">
            Email inválido
          </div>
        </div>

        <!-- Campo de Senha -->
        <div class="relative">
          <label for="password" class="block text-sm font-medium">Senha</label>
          <input type="password" id="password" name="password"
            class="w-full px-3 py-2 pr-10 bg-zinc-900 border border-zinc-700 rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            placeholder="Digite sua senha" onchange="onChangePassword()" />

          <button type="button" onclick="togglePasswordVisibility('password', this)"
            class="absolute right-3 top-10 -translate-y-1/2 text-zinc-400 hover:text-green-500 transition">
            <i class="bi bi-eye text-xl"></i>
          </button>

          <div class="error text-sm text-red-500 hidden" id="password-required-error">
            Senha é obrigatória
          </div>
          <div class="error text-sm text-red-500 hidden" id="password-min-length-error">
            Senha deve ter pelo menos 6 caracteres
          </div>
        </div>


        <!-- Campo de Confirmar Senha -->
        <div class="relative">
          <label for="confirmPassword" class="block text-sm font-medium">Confirmar Senha</label>
          <input type="password" id="confirmPassword" name="confirmPassword"
            class="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            placeholder="Confirme sua senha" onchange="onChangeConfirmPassword()" />

          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
            class="absolute right-3 top-10 -translate-y-1/2 text-zinc-400 hover:text-green-500 transition">
            <i class="bi bi-eye text-xl"></i>
          </button>

          <div class="error text-sm text-red-500 hidden" id="password-dowsnt-match-error">
            Senhas e Confirmar Senha devem ser iguais
          </div>
        </div>

      </form>

      <!-- Botão Registrar -->
      <button type="button"
        class="w-full mt-6 bg-green-500 text-zinc-900 font-medium py-2 rounded-md hover:bg-green-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
        id="register-button" disabled="true" onclick="register()">
        Registrar
      </button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
  <script src="/firebase-init.js"></script>

  <script src="/register/register.js"></script>
  <script src="/validations.js"></script>
  <script src="/loading.js"></script>
</body>

</html>
