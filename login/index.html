<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Pages/home/style-global.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <title>Tela de Login</title>
  </head>

  <body>
    <div class="noise-layer"></div>
    <main class="min-h-screen flex items-center justify-center bg-zinc-900">
      <div
        class="w-full max-w-md bg-zinc-800 text-zinc-200 rounded-lg shadow-lg p-8 space-y-6"
      >
        <h1 class="text-2xl font-bold text-center">Bem Vindo!</h1>
        <p class="text-sm text-center text-zinc-400">
          Ainda não possui uma conta?
          <button
            type="button"
            class="text-green-500 hover:underline"
            onclick="register()"
          >
            Cadastrar-se
          </button>
        </p>

        <form class="space-y-4">
          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium"
              >Email Address</label
            >
            <input
              type="email"
              id="email"
              class="w-full mt-1 px-3 py-2 bg-zinc-700 border border-zinc-600 rounded-md focus:ring-green-500 focus:border-green-500 text-zinc-200 placeholder-zinc-500 transition"
              placeholder="Digite seu email"
              onchange="onChangeEmail()"
            />
            <div
              class="error text-sm text-red-500 mb-2 hidden"
              id="email-required-error"
            >
              Email é obrigatório
            </div>
            <div
              class="error text-sm text-red-500 mb-2 hidden"
              id="email-invalid-error"
            >
              Email inválido
            </div>
          </div>

          <!-- Campo de Senha -->
          <div>
            <label for="password" class="block text-sm font-medium"
              >Senha</label
            >
            <div class="relative mt-1">
              <input
                type="password"
                id="password"
                name="password"
                class="w-full px-3 py-2 bg-zinc-700 border border-zinc-600 rounded-md focus:ring-green-500 focus:border-green-500 text-zinc-200 placeholder-zinc-500 transition"
                placeholder="Digite sua senha"
                onchange="onChangePassword()"
              />
            </div>
            <div
              class="error text-sm text-red-500 hidden"
              id="password-required-error"
            >
              Senha é obrigatória
            </div>
          </div>

          <div class="div-checkbox-login">
            <input type="checkbox" class="checkbox-login" name="remember" />
            <span>Lembrar-me</span>
          </div>

          <!-- Botão Login -->
          <button
            type="button"
            class="btn-login w-full bg-green-500 text-zinc-900 font-medium py-2 rounded-md hover:bg-green-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
            id="login-button"
            disabled="true"
            onclick="login()"
          >
            Entrar
          </button>

          <!-- Links Esqueci Senha e Cadastro -->
          <div
            class="div-link-login flex justify-between items-center text-sm mt-4"
          >
            <button
              type="button"
              class="btn-recover text-green-500 hover:underline disabled:opacity-50 disabled:cursor-not-allowed"
              id="recover-button"
              disabled="true"
              onclick="recoverPassword()"
            >
              Esqueci minha senha!
            </button>
          </div>
        </form>
        <!-- Separador -->
        <div class="flex items-center space-x-2">
          <hr class="flex-grow border-zinc-600" />
          <span class="text-sm text-zinc-400">Or</span>
          <hr class="flex-grow border-zinc-600" />
        </div>

        <!-- Botões de Login Social -->
        <div class="flex justify-center space-x-4">
          <button
            class="flex items-center space-x-2 bg-zinc-700 text-zinc-200 px-4 py-2 rounded-md hover:bg-zinc-600 transition"
          >
            <img
              src="https://www.svgrepo.com/show/355037/google.svg"
              alt="Google"
              class="h-5 w-5"
            />
            <span>Google</span>
          </button>
        </div>
      </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="firebase-init.js"></script>

    <script src="assets/script.js"></script>
    <script src="assets/validations.js"></script>
    <script src="assets/loading.js"></script>
  </body>
</html>
