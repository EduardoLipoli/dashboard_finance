<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style-login.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="icon" type="image/x-icon" href="/images/money.ico" />
  <title>Tela de Login</title>
</head>

<body
  class="bg-[url('images/background.jpg')] bg-cover bg-center bg-no-repeat min-h-screen grid place-items-center px-20">
  <div id="alert-container" class="fixed top-20 right-4 z-50"></div>

  <main class="min-h-screen flex items-center justify-center">
    <div
      class="w-[420px] bg-zinc-800 text-zinc-200 rounded-lg shadow-lg p-8 space-y-6 backdrop-filter backdrop-blur-md bg-opacity-10 border border-zinc-800">
      <h1 class="text-2xl font-bold text-center">Bem Vindo Ao Finance💲</h1>

      <!-- Separador -->
      <div class="flex items-center space-x-2">
        <hr class="flex-grow border-zinc-600" />
      </div>

      <p class="text-sm text-center text-zinc-400">
        Ainda não possui uma conta?
        <button type="button" class="text-green-500 hover:underline" onclick="register()">
          Cadastrar-se
        </button>
      </p>

      <form class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input type="email" id="email"
            class="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
            placeholder="Digite seu email" onchange="onChangeEmail()" />
          <div class="error text-sm text-red-500 mb-2 hidden" id="email-required-error">
            Email é obrigatório
          </div>
          <div class="error text-sm text-red-500 mb-2 hidden" id="email-invalid-error">
            Email inválido
          </div>
        </div>

        <!-- Campo de Senha -->
        <div class="relative">
          <label for="password" class="block text-sm font-medium">Senha</label>
          <div class="relative mt-1">
            <input type="password" id="password" name="password"
              class="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded focus:outline-none focus:ring-2 focus:ring-green-500 transition"
              placeholder="Digite sua senha" onchange="onChangePassword()" />
          </div>

          <button type="button" onclick="togglePasswordVisibility('password', this)"
            class="absolute right-3 top-11 -translate-y-1/2 text-zinc-400 hover:text-green-500 transition">
            <i class="bi bi-eye text-xl"></i>
          </button>

          <div class="error text-sm text-red-500 hidden" id="password-required-error">
            Senha é obrigatória
          </div>
        </div>

        <div class="div-checkbox-login">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" class="checkbox-login accent-green-500 " name="remember" />
            <span class="select-none">Lembrar-me</span>
          </label>
        </div>

        <!-- Botão Login -->
        <button type="button"
          class="btn-login w-full bg-green-500 text-zinc-900 font-medium py-2 rounded-md hover:bg-green-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
          id="login-button" disabled="true" onclick="login()">
          Entrar
        </button>

        <!-- Links Esqueci Senha e Cadastro -->
        <div class="div-link-login flex justify-between items-center text-sm mt-4">
          <button type="button"
            class="btn-recover text-green-500 hover:underline disabled:opacity-50 disabled:cursor-not-allowed"
            id="recover-button" disabled="true" onclick="recoverPassword()">
            Esqueci minha senha!
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>

  <script src="/script-login.js"></script>
  <script src="/validations.js"></script>
  <script src="/loading.js"></script>
</body>

</html>
