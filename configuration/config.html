<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="icon" type="image/x-icon" href="/images/money.ico" />
  <link rel="stylesheet" href="/style-global.css" />
</head>

<body class="bg-zinc-900 text-zinc-200 h-screen grid grid-cols-[auto,1fr]">

  <!-- Alert Container para exibir mensagens -->
  <div id="alert-container" class="fixed top-20 right-4 z-50"></div>

  <!-- Modal Genérico (usado para exclusão e restauração) -->
  <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
    <div class="bg-zinc-900 rounded-lg shadow-lg p-6 w-96 relative">
      <button id="closeCustomModalButton"
        class="absolute top-5 right-5 text-white bg-transparent hover:text-red-500 focus:outline-none text-2xl">
        &times;
      </button>
      <h2 id="customModalTitle" class="text-xl font-bold text-white mb-4"></h2>
      <p id="customModalMessage" class="text-white mb-6"></p>
      <div class="flex justify-center space-x-4">
        <button id="customConfirmButton"
          class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded focus:outline-none">
          Confirmar
        </button>
        <button id="customCancelButton"
          class="bg-zinc-500 hover:bg-zinc-600 text-white py-2 px-4 rounded focus:outline-none">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Excluir uma Categoria -->
  <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
    <div class="bg-zinc-900 rounded-lg shadow-lg p-6 w-96 relative">
      <button id="closeModalButton"
        class="absolute top-5 right-5 text-white bg-transparent hover:text-red-500 focus:outline-none text-2xl">
        &times;
      </button>
      <h2 id="modalTitle" class="text-xl font-bold text-white mb-4"></h2>
      <p id="modalMessage" class="text-white mb-6"></p>
      <div class="flex justify-center space-x-4">
        <button id="deleteConfirmButton"
          class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded focus:outline-none">
          Confirmar
        </button>
        <button id="cancelDeleteButton"
          class="bg-zinc-500 hover:bg-zinc-600 text-white py-2 px-4 rounded focus:outline-none">
          Cancelar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Edição de Categoria -->
  <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center hidden">
    <div class="bg-zinc-900 rounded-lg shadow-lg p-6 w-96 relative">
      <button id="closeEditModal"
        class="absolute top-5 right-5 text-white bg-transparent hover:text-red-500 focus:outline-none text-2xl">
        &times;
      </button>
      <h2 class="text-xl font-bold text-white mb-4">Editar Categoria</h2>
      <input type="text" id="editCategoryInput"
        class="w-full p-2 bg-zinc-700 text-white rounded-md border border-zinc-600 focus:ring-green-500 focus:border-green-500" />
      <div class="flex justify-end mt-4">
        <button id="saveEditCategory" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-md">
          Salvar
        </button>
      </div>
    </div>
  </div>

  <!--SideBar-->
  <div id="sidebar"
    class="flex flex-col items-center bg-zinc-800 h-full w-16 group hover:w-48 transition-all duration-300">
    <div class="p-4">
      <i class="fas fa-coins text-green-500 text-2xl"></i>
    </div>

    <ul class="mt-4 w-full">
      <!-- Seção: Dashboard -->
      <li class="w-full px-4 py-2 hidden group-hover:block text-zinc-500 text-xs uppercase font-semibold">
        Dashboard
      </li>
      <a href="/dashboard/index.html">
        <li class="flex items-center gap-4 p-4 hover:bg-zinc-700 w-full text-zinc-400 text-sm">
          <i class="fas fa-chart-line text-lg"></i>
          <span class="hidden group-hover:block">Dashboard</span>
        </li>
      </a>

      <!-- Seção: Financeiro -->
      <li class="w-full px-4 py-2 mt-2 hidden group-hover:block text-zinc-500 text-xs uppercase font-semibold">
        Financeiro
      </li>
      <a href="/planejamento/index.html">
        <li class="flex items-center gap-4 p-4 hover:bg-zinc-700 w-full text-zinc-400 text-sm">
          <i class="fas fa-bullseye text-lg"></i>
          <span class="hidden group-hover:block">Planejamento</span>
        </li>
      </a>

      <a href="/receitas/transaction.html">
        <li class="flex items-center gap-4 p-4 hover:bg-zinc-700 w-full text-zinc-400 text-sm">
          <i class="fas fa-wallet text-lg"></i>
          <span class="hidden group-hover:block">Carteira</span>
        </li>
      </a>

      <a href="/despesas/transaction.html">
        <li class="flex items-center gap-4 p-4 hover:bg-zinc-700 w-full text-zinc-400 text-sm">
          <i class="fas fa-money-check-alt text-lg"></i>
          <span class="hidden group-hover:block">Despesas</span>
        </li>
      </a>

      <!-- Seção: Configuração -->
      <li class="w-full px-4 py-2 mt-2 hidden group-hover:block text-zinc-500 text-xs uppercase font-semibold">
        Configuração
      </li>
      <a href="/configuration/config.html">
        <li class="flex items-center gap-4 p-4 hover:bg-zinc-700 w-full text-green-500 text-sm">
          <i class="fas fa-cog text-lg"></i>
          <span class="hidden group-hover:block">Configuração</span>
        </li>
      </a>
    </ul>
  </div>

  <!-- Header fixo -->
  <div class="flex-1 flex flex-col">
    <header class="bg-zinc-800 flex items-center justify-between px-6 py-4">
      <h1 class="text-lg font-bold text-green-500 flex-grow">
        <a href="/dashboard/index.html"> Dashboard Financeiro </a>
      </h1>
      
      <!-- Botão do Dropdown -->
      <div class="relative inline-block text-left">
        <button id="dropdownButton"
          class="bg-zinc-900 text-white font-medium py-2 px-4 border border-zinc-700 hover:bg-zinc-800 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 flex items-center space-x-2">

          <img id="user-photo" src="" alt="Foto de Perfil" class="w-8 h-8 rounded-full hidden" />

          <div class="text-left">
            <div id="user-name" class="text-sm font-medium">Carregando...</div>
            <div id="user-email" class="text-xs text-gray-400">Carregando...</div>
          </div>
        </button>

        <div id="dropdownMenu"
          class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-300 rounded-md shadow-lg z-50 p-2">
          <a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100" onclick="logout()">
            <i class="bi bi-box-arrow-left"> </i> Sair
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1">
      <div class="flex flex-1">
        <aside class="w-64 bg-zinc-800 border-r border-zinc-700 p-5 flex-shrink-0">
          <h2 class="text-lg font-semibold mb-4">Configurações</h2>
          <ul class="space-y-2">
            <li>
              <button onclick="showSection('userSettings', event)"
                class="w-full text-left p-3 rounded-md hover:bg-zinc-700 transition" id="defaultActiveButton">
                Configurações do Usuário
              </button>
            </li>
            <li>
              <button onclick="showSection('categorySettings', event)"
                class="w-full text-left p-3 rounded-md hover:bg-zinc-700 transition">
                Categorias
              </button>
            </li>
          </ul>
        </aside>

        <!-- Seção de Configurações -->
        <main class="flex-1 p-6">
          <section id="userSettings" class="bg-zinc-800 p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold mb-6">Configurações do Usuário</h1>
            <div class="mb-6">
              <label class="block text-sm font-medium mb-1">Alterar Nome</label>
              <input type="text" id="newDisplayName" placeholder="Digite seu Nome"
                class="w-full px-4 py-2 bg-zinc-700 border border-zinc-600 rounded-md focus:ring-green-500 focus:border-green-500 transition" />
              <button onclick="updateDisplayName()"
                class="w-full mt-3 bg-green-500 text-white py-2 rounded-md hover:bg-green-600 transition">
                Salvar Nome
              </button>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Alterar Senha</label>
              <input type="password" id="currentPassword" placeholder="Senha atual"
                class="w-full px-4 py-2 bg-zinc-700 border border-zinc-600 rounded-md focus:ring-green-500 focus:border-green-500 transition" />
              <input type="password" id="newPassword" placeholder="Nova senha"
                class="w-full mt-2 px-4 py-2 bg-zinc-700 border border-zinc-600 rounded-md focus:ring-green-500 focus:border-green-500 transition" />
              <button onclick="updatePassword()"
                class="w-full mt-3 bg-green-500 text-white py-2 rounded-md hover:bg-green-600 transition">
                Salvar Senha
              </button>
            </div>
          </section>

          <!-- Configurações de Categorias -->
          <section id="categorySettings" class="hidden bg-zinc-800 p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold mb-6">Categorias</h1>
            <div class="flex justify-end mt-4">
              <button id="restoreCategoriesBtn"
                class="text-sm text-gray-500 hover:text-gray-700 underline transition mb-2">
                Restaurar categorias padrão
              </button>
            </div>

            <div class="flex gap-2 mb-4">
              <button id="expenseBtn" onclick="loadCategories('Gasto')" 
                      class="bg-zinc-700 text-white px-4 py-2 rounded-md transition-all duration-200">
                Despesas
              </button>
              <button id="incomeBtn" onclick="loadCategories('Ganho')"
                      class="bg-zinc-700 text-white px-4 py-2 rounded-md transition-all duration-200">
                Receitas
              </button>
            </div>
            
            
            <form id="addCategoryForm" class="space-y-4">
              <div class="flex items-center space-x-3">
                <input type="text" id="categoryInput" placeholder="Nome da categoria" required
                  class="w-full px-4 py-2 bg-zinc-700 border border-zinc-600 rounded-md focus:ring-green-500 focus:border-green-500 transition" />
                <button type="submit"
                  class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 transition">
                  Adicionar
                </button>
              </div>
            </form>
            <ul id="categoriesContainer" class="mt-4 space-y-3">
              <!-- As categorias serão carregadas aqui -->
            </ul>
          </section>
        </main>
      </div>
    </div>

    <!-- Firebase e seus scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
    <script src="/firebase-init.js"></script>
    
    <script src="/loading.js"></script>
    <script src="config.js"></script>

</body>

</html>
